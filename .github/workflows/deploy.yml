name: Deploy
on:
  push:
    branches: [main]
    # 纯文档/规范变更不触发部署：镜像内容完全由代码与 Dockerfile 决定，
    # 文档改动重建出来的镜像与线上一致，却要把 4 个镜像重新构建推送、
    # 并在生产环境滚动重启一轮。
    # 注意是"全部路径都命中才跳过"——只要本次推送含一个代码/配置文件
    # （.vue/.ts/.cs/Dockerfile/docker-compose.yml/package.json 等），照常部署。
    paths-ignore:
      - '**.md'
      - '.dsh/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TCR_REGISTRY: ccr.ccs.tencentyun.com/jason-hub
  TCR_USERNAME: '100012562502'

jobs:
  # ---- 构建层：4 个镜像并行构建，互不阻塞 ----
  # 拆成并行 job 的原因：原先 4 个 docker build 串行跑在同一个 job 里，
  # 任一镜像构建变慢都会挤占后续镜像的时间，最终撞穿 40 分钟总超时，
  # 整条流水线被杀、"部署到服务器"根本没机会执行（生产环境停在旧镜像）。
  # 现在每个镜像独立 job + 独立超时，最慢的一个也只会拖到自己。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false            # 某个镜像失败不取消其他镜像的构建
      matrix:
        include:
          - service: portfolio
            dockerfile: Portfolio/Dockerfile
          - service: auth
            dockerfile: Auth/api/Dockerfile
          - service: monitor-web
            dockerfile: Monitor/web/Dockerfile
          - service: monitor-api
            dockerfile: Monitor/api/Dockerfile
    name: build ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云 TCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ env.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: 构建并推送 ${{ matrix.service }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.TCR_REGISTRY }}/${{ matrix.service }}:latest
          # GHA 层缓存：基础镜像层、npm ci / dotnet restore 层跨次复用。
          # 没有它时每次都是全新 runner 冷构建——要重新拉 1.7GB 的 .NET SDK
          # 镜像、重跑 NuGet restore，这正是 Auth 构建从 5m38s 劣化到撞超时的原因。
          # mode=max 必须显式指定：默认的 min 只缓存最后一级，而耗时的
          # restore / publish / npm ci 全在中间的 build 阶段。
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: 构建结果摘要
        if: always()
        run: |
          echo "### ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dockerfile: \`${{ matrix.dockerfile }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 镜像: \`${{ env.TCR_REGISTRY }}/${{ matrix.service }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- 结果: ${{ steps.build.outcome }}" >> $GITHUB_STEP_SUMMARY

  # ---- 部署层：4 个镜像全部构建成功后才执行 ----
  # needs 保证矩阵里任一镜像失败都不会部署——避免"3 个新镜像 + 1 个旧镜像"
  # 的半吊子状态被推上生产。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 专用 CI 部署密钥（ed25519 私钥，存于 SERVER_SSH_KEY Secret）。
      # 与开发者个人的 ubuntu.pem 分离：CI 密钥泄露/轮换不影响个人登录，
      # 且服务器侧该公钥带 no-port-forwarding 等限制。
      - name: 配置 SSH 私钥
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # 固定服务器主机公钥（公开信息，非机密）。
      # 相比旧的 StrictHostKeyChecking=no —— 那等于完全放弃主机校验，
      # 中间人可冒充服务器截获部署流量与 TCR 凭据；固定公钥能真正挡住。
      # ⚠️ 服务器重装或重置后主机密钥会变，届时更新下方指纹并同步 DEPLOY.md；
      #    部署报 "Host key verification failed" 即是此原因。
      # ⚠️ 下面按 IP 录入，故 SERVER_HOST Secret 必须是 81.71.136.3（非域名）。
      - name: 固定服务器主机公钥
        run: |
          cat >> ~/.ssh/known_hosts <<'KNOWN_HOSTS'
          81.71.136.3 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKict0paStds5pTxFIoCPMaWWJD6y2x/wU9UJYfxGosD
          81.71.136.3 ssh-rsa 
          81.71.136.3 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL+EVgp5GAZZbT7sPXa65RvQ13KL0IrmJdqwshacPPCY0unuSBMygLDdOvqgOJ4HHVsBPsZOnetYwJS/hV8pqpI=
          KNOWN_HOSTS
          chmod 600 ~/.ssh/known_hosts

      # 密钥认证取代了原先的 sshpass 密码认证，顺带移除了
      # `apt-get install sshpass` 这个脆弱依赖（#121 的部署失败点即在它）。
      - name: 部署到服务器
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.yml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/lujiesheng/docker-compose.yml
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
            set -e
            cd /opt/lujiesheng
            echo "${{ secrets.TCR_PASSWORD }}" | docker login ccr.ccs.tencentyun.com -u ${{ env.TCR_USERNAME }} --password-stdin
            docker compose pull portfolio auth monitor-web monitor-api
            docker compose up -d portfolio auth monitor-web monitor-api
            docker image prune -f
          '
